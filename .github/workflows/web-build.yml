name: Build and test Kathmandu SMP Shop

on:
  push:
    branches:
      - supabase-cloudflare-migration
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Upload Cloudflare Pages build
        uses: actions/upload-artifact@v4
        with:
          name: kathmandu-smp-shop-dist
          path: dist/
